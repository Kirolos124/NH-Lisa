name: Build NetHunter Kernel (lisa)

on:
  workflow_dispatch:
    inputs:
      kernel_rev:
        description: 'Kernel revision to build (default = pinned, matches LOS 23.2-20260922)'
        required: false
        default: '7ede20c8692e0e0fc044754429e33cfd1d75c40d'
      los_boot_url:
        description: 'Reference stock boot.img URL (direct, no extraction needed)'
        required: false
        default: 'https://mirrorbits.lineageos.org/full/lisa/20260922/boot.img'
      los_boot_sha256:
        description: 'SHA256 of the reference boot.img above'
        required: false
        default: '8d702f47e4e27ddf0c3066d65b68052833c28eb250db7598d41838916ad53c72'

env:
  OUT_BASENAME: NetHunter-Kernel-lisa-lineage-23.2-20260922-Android16
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git
  KERNEL_BRANCH: lineage-23.2
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout NH-Lisa repo
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential crossbuild-essential-arm64 \
            python3 libncurses-dev git zip unzip cpio curl wget magiskboot 2>/dev/null || \
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            build-essential python3 libncurses-dev git zip unzip cpio curl wget file

      - name: Clone kernel at pinned revision
        run: |
          KREV="${{ inputs.kernel_rev }}"
          git clone --depth 1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel-src
          cd kernel-src
          git fetch --depth 1 origin "$KREV"
          git checkout "$KREV"
          git rev-parse --short HEAD
          # NOTE: tree must stay CLEAN (no patches): scripts/setlocalversion
          # appends -dirty to uname -r on dirty trees, and stock vendor_dlkm
          # modules (display etc.) refuse to load on a -dirty kernel
          # (vermagic mismatch) -> permanent splash hang. walt/trace.o builds
          # fine under O= without patches (official -I flags active).
          git status --short | head -5
          df -h "$GITHUB_WORKSPACE" | tail -2

      - name: Clone Clang prebuilt (AOSP Android 16 host, clang-r563880c like stock)
        run: |
          git clone --depth 1 --branch android-16.0.0_r4 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang-aosp
          # clang-stable is NOT the real toolchain dir; pin the exact
          # revision stock was built with ("based on r563880c")
          test -x clang-aosp/clang-r563880c/bin/clang
          ln -sfn "$PWD/clang-aosp/clang-r563880c/bin" clang-cc
          clang-cc/clang --version | head -2

      - name: Merge defconfig chain + NetHunter fragment
        run: |
          cd kernel-src
          # -O keeps ALL generated files inside out/ so the srctree stays
          # clean (required for O= builds; also avoids tripping over the
          # focaltech_3680 Makefile which breaks make mrproper/clean).
          mkdir -p out
          ./scripts/kconfig/merge_config.sh -O out \
            arch/arm64/configs/vendor/lahaina-qgki_defconfig \
            arch/arm64/configs/vendor/debugfs.config \
            arch/arm64/configs/vendor/xiaomi_QGKI.config \
            arch/arm64/configs/vendor/lisa_QGKI.config \
            ../kernel/nethunter-lisa.config
          grep -E "CONFIG_USB_G_HID|CONFIG_USB_CONFIGFS_F_HID|CONFIG_ATH9K_HTC|CONFIG_RT2800USB|CONFIG_RTL8187|CONFIG_RTL8192CU|CONFIG_SYSVIPC|CONFIG_CFG80211|CONFIG_MAC80211" out/.config

      - name: Build kernel (Image + modules + dtb)
        run: |
          set -o pipefail
          cd kernel-src
          export PATH="$GITHUB_WORKSPACE/clang-cc:$PATH"
          export ARCH=arm64
          df -h "$GITHUB_WORKSPACE" | tail -2
          # LOS builds out-of-srctree (O=); this activates the
          # -I$(srctree)/$(src) flags needed by in-subdir trace headers
          # (walt / rmnet / hid trace.o). Matches LineageOS kernel.mk.
          # (Srctree is clean thanks to merge -O above, so no mrproper.)
          make O=out -j"$(nproc)" LLVM=1 LLVM_IAS=1 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig
          # NOTE: lisa boots a RAW kernel (BOARD_KERNEL_IMAGE_NAME := Image,
          # stock KERNEL_FMT [raw]). Image.gz will NOT boot (hangs at splash).
          make O=out -j"$(nproc)" LLVM=1 LLVM_IAS=1 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image Image.gz modules dtbs 2>&1 | tee "$GITHUB_WORKSPACE/build-kernel.log" | tail -5
          echo "--- outputs ---"
          ls -lh out/arch/arm64/boot/Image* out/arch/arm64/boot/dts/vendor/ 2>/dev/null | head
          test -f out/arch/arm64/boot/Image || { echo "FATAL: no raw kernel Image produced"; df -h; exit 1; }
          # Hard gate: raw ARM64 Image magic (NOT gzip)
          python3 -c "d=open('out/arch/arm64/boot/Image','rb').read(64); assert d[56:60]==b'ARM\x64', 'kernel is not raw ARM64 Image!'; print('kernel format OK: raw ARM64 Image')"
          # Hard gate: uname -r MUST match stock exactly (no -dirty) or stock
          # vendor_dlkm modules (display!) refuse to load -> splash hang
          python3 -c "import re; d=open('out/arch/arm64/boot/Image','rb').read(); v=re.search(rb'Linux version (5\.4\.302\S*)',d).group(1).decode(); print('kernel version:',v); assert v=='5.4.302-qgki-g7ede20c8692e', f'version mismatch: {v}'"
          # Hard gate: modern clang like stock (NOT clang 12)
          python3 -c "d=open('out/arch/arm64/boot/Image','rb').read(); assert b'clang version 2' in d, 'toolchain too old!'; print('toolchain OK: modern clang')"

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-kernel-log
          path: build-kernel.log

      - name: Collect modules
        run: |
          cd kernel-src
          mkdir -p "$GITHUB_WORKSPACE/out/modules"
          find out -name "*.ko" | while read ko; do cp "$ko" "$GITHUB_WORKSPACE/out/modules/"; done
          ls "$GITHUB_WORKSPACE/out/modules"
          cp out/arch/arm64/boot/Image "$GITHUB_WORKSPACE/out/"
          cp out/arch/arm64/boot/Image.gz "$GITHUB_WORKSPACE/out/"

      - name: Download reference boot.img (direct)
        run: |
          mkdir -p ref && cd ref
          curl -sL "${{ inputs.los_boot_url }}" -o boot.img
          echo "${{ inputs.los_boot_sha256 }}  boot.img" | sha256sum -c -
          ls -lh boot.img
          test -f boot.img || { echo "FATAL: boot.img download failed"; exit 1; }

      - name: Install magiskboot (x86_64, from official Magisk APK)
        run: |
          mkdir -p tools && cd tools
          if command -v magiskboot >/dev/null; then
            cp "$(command -v magiskboot)" ./magiskboot
          else
            MTAG=$(curl -s https://api.github.com/repos/topjohnwu/Magisk/releases/latest | grep '"tag_name"' | head -1 | cut -d'"' -f4)
            echo "Magisk tag: $MTAG"
            curl -sL --fail -o magisk.apk "https://github.com/topjohnwu/Magisk/releases/download/${MTAG}/Magisk-${MTAG}.apk"
            unzip -l magisk.apk | grep -i magiskboot
            unzip -o -j magisk.apk "lib/x86_64/libmagiskboot.so" -d .
            mv libmagiskboot.so magiskboot
            rm -f magisk.apk
          fi
          chmod +x magiskboot
          file magiskboot

      - name: Repack patched boot.img (raw Image + byte-exact stock ramdisk)
        run: |
          set -o pipefail
          MB="$GITHUB_WORKSPACE/tools/magiskboot"
          OUT_IMG="$GITHUB_WORKSPACE/out/boot-patched-lisa-lineage-23.2-20260922-Android16.img"
          cd "$GITHUB_WORKSPACE/ref"
          # Manual v3 repack: stock header (kernel_size updated) + our raw
          # Image + STOCK ramdisk bytes untouched (magiskboot normalizes the
          # ramdisk on repack; byte-exact avoids that whole variable).
          python3 - "$GITHUB_WORKSPACE/out/Image" boot.img "$OUT_IMG" <<'PYEOF'
          import struct, sys
          img, ref, outp = sys.argv[1], sys.argv[2], sys.argv[3]
          k = open(img, 'rb').read()
          r = open(ref, 'rb').read()
          assert r[:8] == b'ANDROID!', 'ref not boot img'
          assert r[40:44] == struct.pack('<I', 3), 'not header v3'
          hdr = bytearray(r[:1580])
          rk = struct.unpack('<I', r[8:12])[0]
          rr = struct.unpack('<I', r[12:16])[0]
          struct.pack_into('<I', hdr, 8, len(k))
          ko = 4096 + ((rk + 4095) // 4096) * 4096
          assert r[ko:ko+2] == b'\x1f\x8b', 'stock ramdisk not gzip?!'
          blob = bytes(hdr) + b'\0' * (4096 - 1580) + k
          blob += b'\0' * ((4096 - (len(k) % 4096)) % 4096)
          blob += r[ko:ko+rr]
          # Append stock tail (zero padding + AVB vbmeta footer) so the layout
          # matches stock exactly. Without it the APatch app's internal
          # magiskboot segfaults on repack (exit 139). Footer lands at EOF,
          # padding absorbs the kernel size difference. APatch fixes up AVB
          # itself during patching (proven: stock+APatch boots on orange).
          blob += r[ko+rr:]
          open(outp, 'wb').write(blob)
          print(f'wrote {outp}: kernel={len(k)} ramdisk={rr} total={len(blob)}')
          PYEOF
          test -f "$OUT_IMG" || { echo "FATAL: repack produced no output"; exit 1; }
          # Verify final image kernel is raw ARM64 (would hang at splash otherwise)
          mkdir -p "$GITHUB_WORKSPACE/ref/verify" && cd "$GITHUB_WORKSPACE/ref/verify"
          "$MB" unpack "$OUT_IMG" >/dev/null
          python3 -c "d=open('kernel','rb').read(64); assert d[56:60]==b'ARM\x64', 'repacked kernel not raw!'; print('repacked kernel OK: raw ARM64 Image')"
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Package AnyKernel3 zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp "$GITHUB_WORKSPACE/out/Image" ak3/Image
          cp "$GITHUB_WORKSPACE/anykernel/anykernel.sh" ak3/anykernel.sh
          mkdir -p ak3/modules/vendor/lib/modules
          cp "$GITHUB_WORKSPACE"/out/modules/*.ko ak3/modules/vendor/lib/modules/ 2>/dev/null || true
          cd ak3 && rm -rf .git && zip -r9 "$GITHUB_WORKSPACE/out/${{ env.OUT_BASENAME }}-AnyKernel3.zip" . -x "*.git*"
          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT_BASENAME }}
          path: out/
